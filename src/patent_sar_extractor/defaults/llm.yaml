shared:
  endpoint: "https://ark.cn-beijing.volces.com/api/coding/v3"
  # Keep secrets out of the repository. Set LLM_API_KEY/VLM_API_KEY in the
  # runtime environment or in a local, uncommitted config overlay.
  api_key: ""
  model: "ark-code-latest"
  timeout: 180

llm:
  max_workers: 4
  cache_path: ""

vlm: {}

# Explicit opt-in only; generic advisory credentials never enable disclosure.
evidence_resolution:
  mode: "off"
  data_consent: false
  max_calls: 8
  timeout: 30
  retries: 0
  max_input_chars: 12000
  max_output_chars: 8192
  max_tokens: 1024

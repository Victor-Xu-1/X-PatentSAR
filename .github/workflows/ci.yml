name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact mainline base for version-prepared PR verification
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PATENTSAR_CI_BASE: ${{ github.event.pull_request.base.sha || inputs.base_sha || github.event.before }}
    steps:
      - name: Initialize external verification paths
        run: |
          mkdir -m 700 -p "$RUNNER_TEMP/x-patentsar-api-tests" "$RUNNER_TEMP/x-patentsar-browser-tests"
          printf 'PATENTSAR_WEB_TEST_ROOT=%s\nPATENTSAR_E2E_OUTPUT_DIR=%s\n' \
            "$RUNNER_TEMP/x-patentsar-api-tests" "$RUNNER_TEMP/x-patentsar-browser-tests" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Validate explicit verification scope
        id: scope
        run: python tools/run_verification_scope.py >> "$GITHUB_OUTPUT"
      - name: Check single next-PR product version
        run: python tools/pr_version.py --base "$PATENTSAR_CI_BASE"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install uv==0.11.31
      - run: uv sync --frozen --extra web
      - run: uv run python tools/build_environment_resources.py --check
      - name: Scoped Python verification
        run: uv run python tools/run_verification_scope.py --phase python
      - run: uv pip check --python .venv/bin/python
      - run: bash -n run_patent_sar.sh
      - name: Verification policy type checks
        run: |
          uv run mypy --strict --follow-imports=silent tools/verification_scope.py tools/run_verification_scope.py
      - name: Frontend install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Scoped frontend verification
        run: uv run python tools/run_verification_scope.py --phase frontend
      - run: uv run python tools/build_frontend.py
      - run: uv run python tools/build_frontend.py --check
      - run: uv run python tools/build_wheel.py --work-root "$RUNNER_TEMP/x-patentsar-builds" --out-dir dist
      - name: Audit and install wheel
        run: |
          uv run python tools/audit_wheel.py dist/*.whl
          uv pip install --python .venv/bin/python --reinstall --no-deps dist/*.whl
          (cd /tmp && "$GITHUB_WORKSPACE/.venv/bin/x-patentsar" --version)
          (cd /tmp && "$GITHUB_WORKSPACE/.venv/bin/x-patentsar" serve --help)
      - name: Install selected browser runtime
        if: steps.scope.outputs.browser_count != '0'
        timeout-minutes: 5
        working-directory: frontend
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "60000"
        run: |
          sudo --preserve-env=GITHUB_ACTIONS python3 ../tools/ci_browser_mirrors.py
          timeout --kill-after=20s 280s npx --no-install playwright install --with-deps --only-shell chromium
      - name: Prepare only the selected controlled browser fixture
        if: steps.scope.outputs.browser_count != '0'
        env:
          PATENTSAR_PADDLEX_OCR_URL: "off"
          PATENTSAR_BASE_PYTHON: ${{ github.workspace }}/.venv/bin/python
          CUDA_VISIBLE_DEVICES: "-1"
        run: |
          mode=$(.venv/bin/python -c 'import json; s=set(json.load(open(".github/verification_scope.json"))["browser_tests"]); print("llm-recovery" if "frontend/e2e/llm-recovery-stack.spec.ts" in s and s <= {"frontend/e2e/product-version.spec.ts", "frontend/e2e/llm-recovery.spec.ts", "frontend/e2e/llm-recovery-stack.spec.ts"} else "llm-settings" if "frontend/e2e/llm-settings.spec.ts" in s and s <= {"frontend/e2e/product-version.spec.ts", "frontend/e2e/topbar.spec.ts", "frontend/e2e/llm-settings.spec.ts", "frontend/e2e/identifier-labels.spec.ts", "frontend/e2e/llm-recovery.spec.ts"} else "read-only" if s <= {"frontend/e2e/product-version.spec.ts", "frontend/e2e/topbar.spec.ts"} else "execution")')
          args=()
          if [ "$mode" = read-only ]; then args+=(--read-only); fi
          if [ "$mode" = llm-settings ]; then args+=(--llm-settings); fi
          if [ "$mode" = llm-recovery ]; then args+=(--llm-recovery); fi
          .venv/bin/python tools/prepare_browser_fixture.py "$RUNNER_TEMP/browser-fixture" --github-env "${args[@]}"
      - name: Real browser workflow against installed wheel
        if: steps.scope.outputs.browser_count != '0'
        env:
          PATENTSAR_E2E_BASE_URL: http://127.0.0.1:18766
          PATENTSAR_PADDLEX_OCR_URL: "off"
          CUDA_VISIBLE_DEVICES: "-1"
        run: |
          .venv/bin/x-patentsar serve --port 18766 --state-dir "$PATENTSAR_WEB_STATE_DIR" > "$RUNNER_TEMP/x-patentsar-web.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"; wait "$server_pid" || true' EXIT
          .venv/bin/python tools/run_verification_scope.py --phase browser
